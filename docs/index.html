<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool Stand Drawing Set</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drafting-room workbench. Sticky sheet tabs on top, the drawing sheet as the hero, a control rail beside it. Paper stays white in both themes. */
:root{
  --bg:#eef0f1; --panel:#ffffff; --ink:#1b2126; --muted:#5d6871; --line:#d3d8dc;
  --accent:#c98a12; --accent-ink:#1b2126; --ok:#1f7a4d; --warn:#b3261e; --chip:#e5e9ec;
  --paper:#ffffff; --pen:#111417; --dim:#1d4f91; --bend:#c62828; --tag:#a2531c;
  --f-ui:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-draw:"Barlow Condensed", "Arial Narrow", sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15191c; --panel:#1e2428; --ink:#e7eaec; --muted:#9aa5ad; --line:#2f373d;
  --accent:#e2a531; --accent-ink:#15191c; --ok:#4cc38a; --warn:#ff7b72; --chip:#283036; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15191c; --panel:#1e2428; --ink:#e7eaec; --muted:#9aa5ad; --line:#2f373d;
  --accent:#e2a531; --accent-ink:#15191c; --ok:#4cc38a; --warn:#ff7b72; --chip:#283036; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.brand h1{font-family:var(--f-draw);font-weight:600;font-size:26px;letter-spacing:.02em;margin:0;text-wrap:balance}
.brand .meta{font-family:var(--f-num);font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;font:500 14px var(--f-ui);border:1px solid var(--line);background:var(--panel);color:var(--ink);
  padding:7px 12px;border-radius:4px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
nav.tabs button .no{font-family:var(--f-num);font-size:11px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.tabs button[aria-selected="true"] .no{color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin-top:16px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stagebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line)}
.stagebar .title{font-family:var(--f-draw);font-size:17px;font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:500 13px var(--f-ui);border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:5px 10px;border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.tog{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
.view{position:relative;aspect-ratio:420/297;max-width:100%;background:#8a949b;touch-action:none;cursor:grab}
.view.dragging{cursor:grabbing}
.view svg.sheet{position:absolute;inset:0;width:100%;height:100%;display:block}
#v3d{position:relative;aspect-ratio:16/10;max-width:100%;touch-action:none;background:var(--panel)}
#v3d canvas{display:block;width:100%!important;height:100%!important}
.hint{font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
aside.rail{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.card h2{font-family:var(--f-draw);font-weight:600;font-size:16px;letter-spacing:.04em;text-transform:uppercase;margin:0 0 8px;color:var(--muted)}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:10px}
.ctl label{font-size:14px}
.ctl output{font-family:var(--f-num);font-size:13px;font-variant-numeric:tabular-nums}
.ctl input{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.checks{display:flex;flex-direction:column;gap:7px}
.chk{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:start;font-size:13.5px}
.pill{font:600 11px var(--f-num);padding:2px 6px;border-radius:3px;letter-spacing:.04em;color:#fff;margin-top:2px}
.pill.ok{background:var(--ok)} .pill.bad{background:var(--warn)}
.chk .v{font-family:var(--f-num);font-size:12px;color:var(--muted);grid-column:2}
.small{font-size:13px;color:var(--muted);margin:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--f-num);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
/* drawing paper styles */
svg.sheet{font-family:var(--f-draw)}
svg.sheet .paper{fill:var(--paper)}
svg.sheet .vis{fill:none;stroke:var(--pen);stroke-width:.45;stroke-linejoin:round}
svg.sheet .solid{fill:#e9ecee;stroke:var(--pen);stroke-width:.4;fill-rule:evenodd}
svg.sheet .thin{fill:none;stroke:var(--pen);stroke-width:.18}
svg.sheet .hid{fill:none;stroke:var(--pen);stroke-width:.2;stroke-dasharray:1.2 .8}
svg.sheet .ph{fill:none;stroke:#7b858c;stroke-width:.25;stroke-dasharray:3 .8 .5 .8}
svg.sheet .cl{fill:none;stroke:#7b858c;stroke-width:.15;stroke-dasharray:3 .7 .6 .7}
svg.sheet .bend{fill:none;stroke:var(--bend);stroke-width:.3;stroke-dasharray:2 1}
svg.sheet .dim line,svg.sheet .dim path.l{stroke:var(--dim);stroke-width:.18;fill:none}
svg.sheet .dim path.a{fill:var(--dim);stroke:none}
svg.sheet .dim text{fill:var(--dim);font-size:3px;font-family:var(--f-draw)}
svg.sheet text{fill:var(--pen)}
svg.sheet .tag{fill:var(--tag);font-size:2.6px;font-weight:600;font-family:var(--f-num)}
svg.sheet .bendtxt{fill:var(--bend);font-size:2.6px}
svg.sheet .lbl{font-size:3.6px;font-weight:600;letter-spacing:.06em}
svg.sheet .note{font-size:2.9px}
svg.sheet .noteh{font-size:3.3px;font-weight:600;letter-spacing:.05em}
svg.sheet .tb{fill:none;stroke:var(--pen);stroke-width:.35}
svg.sheet .tbs{font-size:2.2px;fill:#5d6871}
svg.sheet .tbv{font-size:3.4px;font-weight:500}
svg.sheet .tbt{font-size:5px;font-weight:600}
svg.sheet .num{font-family:var(--f-num)}
svg.sheet .ball circle{fill:#fff;stroke:var(--pen);stroke-width:.3}
svg.sheet .ball text{font-size:3.2px;font-weight:600;text-anchor:middle;dominant-baseline:central}
svg.sheet .ball line{stroke:var(--pen);stroke-width:.2}
svg.sheet .tool{fill:none;stroke:#8d969c;stroke-width:.35}
svg.sheet .bad{stroke:var(--bend)!important}
svg.sheet .row line{stroke:var(--pen);stroke-width:.15}
svg.sheet.hide-dims .dim, svg.sheet.hide-tags .tag, svg.sheet.hide-cl .cl{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>

<header class="top">
  <div class="brand">
    <h1>Screwdriver &amp; Tool Desk Stand</h1>
    <span class="meta">DWG TS-000 · REV L · 1.5 mm MS + HDG · 2026-10-25 · units mm · 1st-angle projection</span>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>

<div class="work">
  <section class="stage" aria-live="polite">
    <div class="stagebar">
      <span class="title" id="stageTitle"></span>
      <div class="tools" id="sheetTools">
        <button class="btn" id="zin" type="button" aria-label="Zoom in">+</button>
        <button class="btn" id="zout" type="button" aria-label="Zoom out">−</button>
        <button class="btn" id="zfit" type="button">Fit</button>
        <label class="tog"><input type="checkbox" id="lDims" checked> Dims</label>
        <label class="tog"><input type="checkbox" id="lTags" checked> Hole tags</label>
        <label class="tog"><input type="checkbox" id="lCl" checked> Centre lines</label>
      </div>
      <div class="tools" id="v3dTools" hidden>
        <label class="tog"><input type="checkbox" id="tTools" checked> Sample tools</label>
        <label class="tog"><input type="checkbox" id="tExplode"> Exploded</label>
        <button class="btn" id="vIso" type="button">Iso</button>
        <button class="btn" id="vSide" type="button">Side</button>
        <button class="btn" id="vFront" type="button">Front</button>
      </div>
    </div>
    <div class="view" id="view"></div>
    <div id="v3d" hidden></div>
    <div class="hint" id="hint">Scroll or pinch to zoom, drag to pan. The DXF governs all cut geometry; do not scale prints.</div>
  </section>

  <aside class="rail">
    <div class="card">
      <h2>Stand setting</h2>
      <div class="ctl"><label for="sAlpha">Arm lean back</label><output id="oAlpha"></output><input type="range" id="sAlpha" min="-15" max="45" step="1"></div>
      <div class="ctl" hidden><label for="sS">Tray pivot</label><output id="oS"></output><input type="range" id="sS" min="120" max="120" step="1"></div>
      <div class="ctl"><label for="sTh">Tray tilt (front down)</label><output id="oTh"></output><input type="range" id="sTh" min="0" max="60" step="1"></div>
      <div class="ctl"><label for="sSh">Tool shank below lower plate</label><output id="oSh"></output><input type="range" id="sSh" min="60" max="170" step="5"></div>
      <div class="presets" id="presets"></div>
    </div>
    <div class="card">
      <h2>Checks at this setting</h2>
      <div class="checks" id="checks"></div>
    </div>
    <div class="card">
      <h2>Cut summary</h2>
      <dl class="kv" id="cutsum"></dl>
    </div>
  </aside>
</div>

const P = GEO.params;
const yc = P.D/2;
const state = {alpha:0, s:190, theta:30, shank:130, sheet:"s3d"};
const R = Math.PI/180;
const FRICTION_CAP = 5.0; // N·m per joint at ~2 kN clamp (see notes)

/* ---------------- kinematics (mirrors the Python checks) ---------------- */
const kg = {top:GEO.TOP_PLATE.kg, low:GEO.LOWER_PLATE.kg, base:GEO.BASE.kg, arm:GEO.ARM.kg, so:0.14, tools:1.5};
function pose(alpha=state.alpha, s=state.s, theta=state.theta){
  const a=alpha*R, t=theta*R;
  const p1=[P.YB,P.H1], p2=[P.YB+s*Math.sin(a), P.H1+s*Math.cos(a)];
  const G=(y,h)=>{const dy=y-yc, dz=-(h-P.H2);return [p2[0]+dy*Math.cos(t)-dz*Math.sin(t), p2[1]+dy*Math.sin(t)+dz*Math.cos(t)]};
  return {p1,p2,t,a,G};
}
function evaluate(){
  const {p1,p2,t,G}=pose();
  const tips=[10,yc,P.D-10].map(y=>G(y,P.T)[1]-state.shank*Math.cos(t));
  const tip=Math.min(...tips);
  const plateLow=Math.min(G(0,P.T)[1],G(P.D,P.T)[1]);
  const parts=[[kg.top,G(yc,-P.GAP+1)],[kg.low,G(yc,1)],[kg.so,G(yc,-P.GAP/2)],[kg.tools,G(yc,-P.GAP-30)]];
  const mt=parts.reduce((s,q)=>s+q[0],0), cgt=parts.reduce((s,q)=>s+q[0]*q[1][0],0)/mt;
  const armMid=(p1[0]+p2[0])/2;
  const cg=(cgt*mt+2*kg.arm*armMid+kg.base*P.BASE_D/2)/(mt+2*kg.arm+kg.base);
  const g=9.81;
  const tP2=mt*g*Math.abs(cgt-p2[0])/1000/2;
  const tP1=(mt*g*Math.abs(cgt-p1[0])+2*kg.arm*g*Math.abs(armMid-p1[0]))/1000/2;
  const front=G(0,-P.GAP);
  return {tip,plateLow,cg,tP1,tP2,frontH:front[1],frontY:front[0],mt};
}

function dimH(x1,y1,x2,y2,yd,txt){ // horizontal distance, dim line at paper y = yd
  const s=Math.sign(yd-y1)||1, s2=Math.sign(yd-y2)||1;
  const xa=Math.min(x1,x2), xb=Math.max(x1,x2), w=xb-xa;

  if(!out){o+=`<line x1="${xa}" y1="${yd}" x2="${xb}" y2="${yd}"/>${arrow(xa,yd,Math.PI)}${arrow(xb,yd,0)}<text x="${(xa+xb)/2}" y="${yd-0.9}" text-anchor="middle">${txt}</text>`;}
  else{o+=`<line x1="${xa-6}" y1="${yd}" x2="${xb+6}" y2="${yd}"/>${arrow(xa,yd,0)}${arrow(xb,yd,Math.PI)}<text x="${xb+7}" y="${yd+1}" >${txt}</text>`;}
  return o+"</g>";
}
function dimV(x1,y1,x2,y2,xd,txt){
  const s=Math.sign(xd-x1)||1, s2=Math.sign(xd-x2)||1;

  else{o+=`<line x1="${xd}" y1="${ya-6}" x2="${xd}" y2="${yb+6}"/>${arrow(xd,ya,Math.PI/2)}${arrow(xd,yb,-Math.PI/2)}<text transform="translate(${xd-0.9} ${yb+7}) rotate(-90)" text-anchor="end">${txt}</text>`;}

function partSVG(name,V,opt={}){

  g.feats.forEach(f=>{if(f.t==="c"){const [x,y]=V.p(f.x,f.y);o+=`<circle class="vis" cx="${x}" cy="${y}" r="${f.d/2*V.k}"/>`+cmark(x,y,f.d/2*V.k);}});
  (g.bends||[]).forEach(b=>{const [x0,y0]=V.p(b[0],b[1]),[x1,y1]=V.p(b[0],b[2]);
    o+=`<line class="bend" x1="${x0}" y1="${y0-2}" x2="${x1}" y2="${y1+2}"/><text class="bendtxt" transform="translate(${x0+(b[0]>0?-1.4:2.6)} ${(y0+y1)/2}) rotate(-90)" text-anchor="middle">${b[3]}</text>`;});
  return o;
}

  return o;}

function holeTable(x,y){
  const cols=[{h:"TAG",w:9},{h:"SIZE",w:36,fs:2.4},{h:"QTY",w:8,a:"r"},{h:"X FROM ℄ (mm)",w:64,mono:1,fs:2.3},{h:"Y FRONT (mm)",w:28,mono:1,fs:2.3},{h:"FOR",w:60,fs:2.4}];

    [-len/2+2.5,len/2-2.5].forEach(x=>{const w=new THREE.Mesh(washer,steel);w.rotation.z=Math.PI/2;w.position.x=x;g.add(w);});scene.add(g);return g;};
  const bolts={p1:[mkBolt(18),mkBolt(18)],p2:[mkBolt(18),mkBolt(18)]};
  // sample tools: handles above, shanks below (shank length follows slider)
  const tools=new THREE.Group();tray.add(tools);
  const handleCols=[0xd0302a,0x1d1f21,0xd0302a,0x1d1f21,0xe0b020];
  const toolPts=GEO.pattern.filter(p=>p.k==="c"&&"LMN".includes(p.g[0])).filter((p,i)=>i%2===0);
  const shankMeshes=[];
  toolPts.forEach((p,i)=>{const hr={L:14,M:11,N:8}[p.g[0]], hl={L:95,M:80,N:65}[p.g[0]];
    const h=new THREE.Mesh(new THREE.CylinderGeometry(hr*0.85,hr,hl,16),new THREE.MeshStandardMaterial({color:handleCols[i%5],roughness:.5}));
    h.position.set(p.x,P.H2+P.GAP+hl/2,-(p.y-yc));cast(h);tools.add(h);
    const sm=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(3,p.w/2-1),Math.min(3,p.w/2-1),1,10),steel.clone());sm.userData={x:p.x,y:p.y};tools.add(sm);shankMeshes.push(sm);});
  three={renderer,scene,cam,ctl,el,arms,tray,bolts,tools,shankMeshes,topGroup,sos};
  setCam("iso");
  new ResizeObserver(resize3d).observe(el);
  poseThree();resize3d();
  (function loop(){requestAnimationFrame(loop);if(!el.hidden){ctl.update();renderer.render(scene,cam);}})();
  // offscreen renderer for the assembly sheet isometric
  three.iso=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true,alpha:false});three.iso.setSize(900,680);three.iso.setPixelRatio(1);three.iso.shadowMap.enabled=true;
  three.isoCam=new THREE.PerspectiveCamera(24,900/680,10,5000);
  snapIso();
}
function setCam(v){if(!three)return;const t=three.ctl.target;t.set(0,130,0);
  const p={iso:[520,420,620],side:[900,140,0],front:[0,160,900]}[v];three.cam.position.set(...p);three.ctl.update();}
function resize3d(){if(!three)return;const r=three.el.getBoundingClientRect();if(!r.width)return;three.renderer.setSize(r.width,r.height,false);three.cam.aspect=r.width/r.height;three.cam.updateProjectionMatrix();}
function poseThree(){const {p1,p2,a,t,G}=pose();const W=(Y,Z)=>[Y,Z];
  const toZ=Y=>P.BASE_D/2-Y;
  three.arms.forEach(g=>{g.position.set(0,p1[1],toZ(p1[0]));g.rotation.set(Math.PI/2-a,0,0);});
  three.tray.position.set(0,p2[1],toZ(p2[0]));three.tray.rotation.set(t,0,0);
  const ex=document.getElementById("tExplode").checked;
  three.topGroup.position.y=ex?60:0;three.sos.forEach(s=>s.position.y=ex?30:0);
  three.bolts.p1.forEach((b,i)=>b.position.set((i?-1:1)*(P.X_ARM_IN),p1[1],toZ(p1[0])));
  three.bolts.p2.forEach((b,i)=>{b.position.set((i?-1:1)*(P.X_ARM_IN),p2[1],toZ(p2[0]));b.scale.set(1,1,1);});
  three.tools.visible=document.getElementById("tTools").checked;
  three.shankMeshes.forEach(m=>{const L=state.shank+P.T;m.scale.y=L;m.position.set(m.userData.x,P.H2-L/2+P.T-P.T,-(m.userData.y-yc));
    const tip=G(m.userData.y,P.T)[1]-state.shank*Math.cos(t);m.material.color.setHex(tip<3?0xd32f2f:0x6f777d);});
}
function snapIso(){if(!three||!three.iso)return;const c=three.isoCam;c.position.set(560,430,640);c.lookAt(0,120,0);
  const bg=three.scene.background;three.scene.background=new THREE.Color(0xffffff);const desk=three.scene.children.find(o=>o.geometry&&o.geometry.type==="PlaneGeometry");if(desk)desk.visible=false;
  three.iso.render(three.scene,c);isoURL=three.iso.domElement.toDataURL("image/png");three.scene.background=bg;if(desk)desk.visible=true;
  const im=document.getElementById("isoImg");if(im)im.setAttribute("href",isoURL);}
document.getElementById("vIso").onclick=()=>setCam("iso");document.getElementById("vSide").onclick=()=>setCam("side");document.getElementById("vFront").onclick=()=>setCam("front");
["tTools","tExplode"].forEach(id=>document.getElementById(id).addEventListener("change",()=>three&&poseThree()));

/* ---------------- boot ---------------- */
[state.alpha,state.s,state.theta]=Object.values(GEO.presets)[1];
syncInputs();renderChecks();
let start="s3d";try{start=localStorage.getItem("ts-sheet")||"s3d"}catch(e){}
const hash=location.hash.replace("#","");if(SHEETS.some(s=>s.id===hash))start=hash;
init3d();select(start);
</script>
